version: "3.8"

services:
  face_api:
    build: .
    container_name: face_api
    ports:
      - "5000:5000"   # adjust if your app serves HTTP
    stdin_open: true  # keep STDIN open
    tty: true         # allocate a pseudo-TTY
    restart: unless-stopped
    volumes:
      - .:/app        # mount your project folder for live updates